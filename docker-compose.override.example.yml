# Full-stack override: live API + dashboard (what the browser extension reads),
# the scheduled OpenIntent refresh (the exporter is baked into the image), and
# Cloudflare tunnel for reaching the bridge from outside the LAN.
#
# The Catalyst facade is not part of this. It does sync — but only if every AP
# declares a Cisco model, which misrepresents your hardware to Hamina's coverage
# simulation. Enable it deliberately if you want that trade-off; see
# docs/CATALYST.md.
#
# To publish on a different host port, set HOST_PORT in .env. Do NOT add a
# `ports:` key here: compose APPENDS to sequences rather than replacing them, so
# you would publish both and collide with whatever already holds 8080.
#
# Usage:
#   git clone https://github.com/shark-fi/unifi-hamina-live.git
#   cd unifi-hamina-live
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   cp .env.example .env      # fill it in (see the runbook)
#   docker compose --profile tunnel up -d --build
#
# Compose auto-merges docker-compose.override.yml over docker-compose.yml.
services:
  unifi-hamina-live:
    volumes:
      # persist generated OpenIntent zips / CSVs on the host
      - ./exports:/app/exports
      # The exporter is BAKED INTO THE IMAGE at a pinned commit — you do not
      # need to clone it. Uncomment only to run against your own checkout:
      # - ../unifi-hamina-export/unifi_export.py:/opt/exporter/unifi_export.py:ro
      # The cell inventory, when OPEN5GS_ENABLED=true. It lives on the host so
      # you can edit a cell's radio or move it on the plan without rebuilding;
      # OPEN5GS_CELLS_PATH must point at the path INSIDE the container.
      # - ./cells.json:/app/cells.json:ro

    # An Open5GS core in its own compose project is on its own network, so the
    # bridge cannot resolve `amf` by name until it joins that network. Either
    # attach it here and use container names in OPEN5GS_*_URL, or publish each
    # NF's 9090 on the host and point at those.
    # networks: [default, open5gs]

# networks:
#   open5gs:
#     external: true
#     name: <the core's compose network>
